{% extends 'base.html' %}

{% block content %}
<div class="bg-white rounded-3xl shadow-sm overflow-hidden flex flex-col md:flex-row">
    <div class="md:w-1/2 bg-sage-50 relative">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.name }}" class="w-full h-full object-cover aspect-square">
        {% else %}
            <div class="flex items-center justify-center h-full aspect-square text-sage-300 font-serif text-8xl">M</div>
        {% endif %}
    </div>
    <div class="md:w-1/2 p-8 md:p-14 flex flex-col justify-center">
        <p class="text-xs tracking-ultra text-sage-400 uppercase mb-3">Букет</p>
        <h1 class="text-4xl font-serif font-light text-sage-800 mb-5 leading-tight">{{ product.name }}</h1>
        <p class="text-3xl font-serif font-medium text-sage-600 mb-8">{{ product.price }} ₽</p>
        <div class="w-16 h-px bg-sage-300 mb-8"></div>
        <p class="text-gray-600 mb-10 leading-relaxed font-light">{{ product.description|linebreaks }}</p>

        <form action="{% url 'shop:cart_add' product.id %}" method="post" class="flex items-center gap-4">
            {% csrf_token %}
            <div class="flex items-center border border-sage-200 rounded-full overflow-hidden">
                <input type="number" name="quantity" value="1" min="1"
                       class="w-16 text-center py-3 focus:outline-none focus:bg-sage-50 bg-transparent">
            </div>
            <button type="submit"
                    class="flex-grow bg-sage-400 hover:bg-sage-500 text-white py-3.5 px-8 rounded-full font-medium transition text-base tracking-wide shadow-sm">
                Добавить в корзину
            </button>
        </form>

        <a href="{% url 'shop:product_list' %}" class="mt-8 text-sage-500 hover:text-sage-700 text-sm tracking-wide">← Вернуться в каталог</a>
    </div>
</div>
{% endblock %}
