{% extends 'base.html' %}
{% block title %}Регистрация — Muzflowers{% endblock %}
{% block content %}<main class="w auth"><h1 class="st">Регистрация</h1>
<form method="post">{% csrf_token %}
{{ form.non_field_errors }}
{% for f in form %}<label>{{ f.label }}{{ f }}{% if f.help_text %}<small>{{ f.help_text|safe }}</small>{% endif %}{{ f.errors }}</label>
{% endfor %}<button class="btn">Создать аккаунт</button></form>
<p class="sd">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a></p></main>{% endblock %}
