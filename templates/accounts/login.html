{% extends 'base.html' %}
{% block title %}Вход — Muzflowers{% endblock %}
{% block content %}<main class="w auth"><h1 class="st">Вход</h1>
<form method="post">{% csrf_token %}
{{ form.non_field_errors }}
{% for f in form %}<label>{{ f.label }}{{ f }}{% if f.help_text %}<small>{{ f.help_text|safe }}</small>{% endif %}{{ f.errors }}</label>
{% endfor %}<input type="hidden" name="next" value="{{ next }}">
<button class="btn">Войти</button></form>
<p class="sd">Ещё нет аккаунта? <a href="{% url 'accounts:register' %}">Зарегистрируйтесь</a></p></main>{% endblock %}
