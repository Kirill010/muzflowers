name: Проверка сайта

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка настроек и миграций
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Тесты на SQLite
        run: python manage.py test
      - name: Проверка боевых настроек
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ${{ github.sha }}-ci-only-key-with-enough-length-0123456789-abcdefghij
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy --fail-level WARNING

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Первый запуск через start.bat
        shell: pwsh
        env:
          NO_BROWSER: "1"
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'muzflowers-start.out'
          $stderr = Join-Path $env:RUNNER_TEMP 'muzflowers-start.err'
          $server = Start-Process -FilePath $env:ComSpec -ArgumentList '/d', '/c', 'start.bat' `
            -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $healthy = $false
            for ($i = 0; $i -lt 90; $i++) {
              if ($server.HasExited) { throw 'start.bat завершился до запуска сервера' }
              try {
                $health = Invoke-RestMethod -Uri http://127.0.0.1:8000/health/ -TimeoutSec 3
                if ($health.ok) { $healthy = $true; break }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $healthy) { throw 'Сервер не ответил на проверку здоровья' }
            foreach ($path in @('/', '/catalog/?budget=premium', '/bouquet/', '/admin/login/', '/static/shop/img/flowers/rose.webp')) {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8000$path" -TimeoutSec 5
              if ($response.StatusCode -ne 200) { throw "Не открылась страница $path" }
            }
          } catch {
            Get-Content -LiteralPath $stdout, $stderr -ErrorAction SilentlyContinue
            throw
          } finally {
            if (-not $server.HasExited) {
              taskkill.exe /PID $server.Id /T /F | Out-Null
            }
          }

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: muzflowers
          POSTGRES_USER: muzflowers
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U muzflowers -d muzflowers"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DJANGO_DB_URL: postgresql://muzflowers:ci-only@127.0.0.1:5432/muzflowers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Проверка общего кэша Redis
        env:
          DJANGO_REDIS_URL: redis://127.0.0.1:6379/1
        run: python manage.py shell -c "from django.core.cache import cache; cache.set('ci-check', 'ok', 30); assert cache.get('ci-check') == 'ok'"
      - name: Миграции и весь набор тестов на PostgreSQL
        run: |
          python manage.py migrate --noinput
          python manage.py test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Проверка Compose
        env:
          POSTGRES_PASSWORD: ci-only
        run: |
          printf 'DJANGO_SECRET_KEY=ci-only\nDJANGO_DEBUG=0\n' > .env.production
          docker compose --env-file .env.production config --quiet
          rm .env.production
      - name: Сборка Docker-образа
        run: docker build -t muzflowers-ci .
      - name: Запуск и проверка здоровья контейнера
        run: |
          docker run -d --name muzflowers-ci \
            -e DJANGO_SECRET_KEY=ci-only-key-with-enough-length-0123456789-abcdefghij \
            -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e DJANGO_SSL=0 \
            -e SITE_URL=http://localhost \
            -p 127.0.0.1:8000:8000 \
            muzflowers-ci
          status=starting
          for i in $(seq 1 30); do
            status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' muzflowers-ci)
            if [ "$status" = healthy ]; then break; fi
            if [ "$status" = unhealthy ] || [ "$status" = dead ] || [ "$status" = exited ]; then
              docker logs muzflowers-ci
              exit 1
            fi
            sleep 2
          done
          if [ "$status" != healthy ]; then
            docker logs muzflowers-ci
            exit 1
          fi
          curl --fail --silent http://127.0.0.1:8000/health/
      - name: Очистка контейнера
        if: always()
        run: docker rm -fv muzflowers-ci || true
